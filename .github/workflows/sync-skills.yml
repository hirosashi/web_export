name: Sync skills to plugins

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-skills-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install --quiet pyyaml
      - name: Regenerate and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/sync-skills.py
            git add -A .claude-plugin .devin-plugin plugins
            if git diff --cached --quiet; then
              echo "plugins already in sync"
              exit 0
            fi
            git commit -m "chore: sync plugins from .agents/skills"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), retrying from latest main"
          done
          exit 1
